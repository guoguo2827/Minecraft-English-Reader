<!doctype html>
<html lang="en">
<head>
  <!-- CN_READER_UI_20260712D -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minecraft Chinese Reader</title>
  <style>
    :root {
      --leaf: #2f8f3b;
      --leaf-dark: #1d5e2d;
      --paper: #fff8df;
      --ink: #1b1b16;
      --wood: #6f4725;
      --mint: #dff4d7;
      --sky: #4db7e9;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      overflow: hidden;
      color: var(--ink);
      font-family: "Trebuchet MS", "Microsoft YaHei", sans-serif;
      background:
        repeating-linear-gradient(45deg, rgba(47, 143, 59, .08) 0 12px, transparent 12px 24px),
        linear-gradient(135deg, #ecf9dc, #d4f1dc 45%, #fdf5d1);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 14px 18px;
      border-bottom: 5px solid #3b210f;
      background: linear-gradient(180deg, #845126, #5e3519);
      color: #fff6dc;
      box-shadow: 0 8px 18px rgba(32, 22, 12, .25);
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 3vw, 42px);
      letter-spacing: 0;
      text-shadow: 2px 3px 0 rgba(0,0,0,.35);
    }

    .subtitle {
      margin: 3px 0 0;
      color: #d8ff9d;
      font-weight: 900;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .pill {
      min-height: 42px;
      padding: 8px 14px;
      border: 4px solid #f4e68e;
      border-radius: 8px;
      background: #173b27;
      color: #fff8da;
      font-weight: 1000;
      box-shadow: inset 0 -4px 0 rgba(0,0,0,.22);
    }

    main {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      gap: 14px;
      min-height: 0;
      padding: 14px;
    }

    .sidebar {
      min-height: 0;
      overflow-y: auto;
      padding-right: 6px;
    }

    .theme-tab {
      width: 100%;
      display: grid;
      grid-template-columns: 54px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      margin: 0 0 10px;
      padding: 8px;
      border: 4px solid var(--wood);
      border-radius: 8px;
      background: #fff4c9;
      text-align: left;
      color: #1d2a14;
      box-shadow: inset 0 -4px 0 rgba(108, 75, 34, .18);
    }

    .theme-tab.active {
      background: linear-gradient(180deg, #60cf59, #2f9f43);
      color: #fff;
      border-color: #18541f;
    }

    .tab-num {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border: 3px solid rgba(255,255,255,.55);
      border-radius: 7px;
      background: #27814a;
      color: white;
      font-size: 24px;
      font-weight: 1000;
    }

    .tab-title {
      min-width: 0;
      font-weight: 1000;
      font-size: 17px;
    }

    .tab-title small {
      display: block;
      margin-top: 2px;
      font-size: 12px;
      color: inherit;
      opacity: .78;
    }

    .workspace {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 12px;
      overflow: hidden;
    }

    .study-bar {
      display: grid;
      grid-template-columns: minmax(120px, .45fr) minmax(220px, .65fr) minmax(520px, 1.7fr);
      gap: 10px;
      align-items: center;
      padding: 12px;
      border: 4px solid var(--wood);
      border-radius: 8px;
      background: rgba(255, 248, 223, .95);
    }

    .study-actions {
      grid-column: 1 / -1;
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      align-items: center;
    }

    .study-bar h2 {
      margin: 0;
      color: var(--leaf-dark);
      font-size: clamp(22px, 2.6vw, 34px);
    }

    .study-bar p {
      margin: 2px 0 0;
      font-weight: 900;
      color: #6b4c28;
    }

    .mode-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 6px;
      border: 4px solid #6b4a23;
      border-radius: 8px;
      background: #3d2818;
    }

    .mode-switch button {
      min-height: 40px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #fff8da;
      font-weight: 1000;
    }

    body[data-study-mode="learn"] [data-mode-button="learn"],
    body[data-study-mode="quiz"] [data-mode-button="quiz"] {
      background: #f5c94d;
      color: #20330f;
      box-shadow: inset 0 -4px 0 rgba(0,0,0,.18);
    }

    .core-reward {
      display: grid;
      grid-template-columns: 56px minmax(150px, 1fr) minmax(210px, auto);
      gap: 8px;
      align-items: center;
      min-width: 0;
      padding: 8px;
      border: 4px solid #2a1a0c;
      border-radius: 8px;
      background:
        repeating-linear-gradient(45deg, rgba(255,255,255,.08) 0 8px, transparent 8px 16px),
        linear-gradient(180deg, #213c21, #142715);
      color: #fff8da;
      box-shadow: inset 0 -6px 0 rgba(0,0,0,.24);
    }

    .core-gem {
      display: grid;
      place-items: center;
      width: 50px;
      height: 50px;
      border: 3px solid rgba(255,255,255,.32);
      border-radius: 8px;
      background: rgba(0,0,0,.2);
      box-shadow: 0 0 18px var(--gem-glow, rgba(84,240,216,.45));
    }

    .core-gem svg {
      width: 38px;
      height: 38px;
      image-rendering: pixelated;
    }

    .core-reward h3 {
      margin: 0;
      font-size: clamp(16px, 1.5vw, 22px);
      line-height: 1;
    }

    .core-reward p {
      margin: 4px 0 0;
      color: #ffe89b;
      font-size: 13px;
    }

    .reward-bar {
      grid-column: 1 / -1;
      height: 14px;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,.28);
      border-radius: 8px;
      background: rgba(0,0,0,.28);
    }

    .reward-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #2fae57, #71e6ff, #fff2a8);
      transition: width .45s ease;
    }

    .reward-stats {
      display: grid;
      grid-template-columns: repeat(3, auto);
      gap: 8px;
      font-weight: 1000;
      white-space: nowrap;
      color: #cce8bd;
      font-size: 12px;
    }

    .cards {
      min-height: 0;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(5, minmax(132px, 1fr));
      gap: 12px;
      align-content: start;
      padding: 2px 4px 12px;
    }

    .word-card {
      display: grid;
      grid-template-rows: minmax(118px, 1fr) auto;
      min-height: 210px;
      padding: 0;
      overflow: hidden;
      border: 4px solid #69451f;
      border-radius: 8px;
      background: #fffdf5;
      box-shadow: inset 0 -5px 0 rgba(101, 64, 25, .14);
    }

    .word-card.speaking {
      outline: 5px solid #f5d94d;
      transform: translateY(-2px);
    }

    .thumb {
      display: grid;
      place-items: center;
      min-height: 126px;
      padding: 14px;
      background: #edf9e8;
      border-bottom: 3px solid #d6c59d;
    }

    .thumb img {
      max-width: 100%;
      max-height: 112px;
      object-fit: contain;
      image-rendering: pixelated;
    }

    .word-meta {
      display: grid;
      gap: 4px;
      align-content: center;
      min-height: 70px;
      padding: 10px;
      text-align: center;
      background: #fff8e7;
    }

    .word-meta b {
      font-size: clamp(19px, 1.7vw, 26px);
      line-height: 1.05;
      overflow-wrap: anywhere;
    }

    .word-meta span {
      color: #16812a;
      font-size: 20px;
      font-weight: 1000;
    }

    body[data-show-en="false"] .en-text {
      visibility: hidden;
    }

    body[data-study-mode="quiz"] .cards {
      filter: blur(5px) grayscale(.18);
      opacity: .45;
      pointer-events: none;
      user-select: none;
    }

    body[data-study-mode="learn"] .quiz {
      filter: blur(5px) grayscale(.18);
      opacity: .45;
      pointer-events: none;
      user-select: none;
    }

    .quiz {
      display: grid;
      grid-template-columns: minmax(210px, .9fr) auto auto auto minmax(0, 2.6fr);
      gap: 10px;
      align-items: center;
      padding: 12px;
      border: 4px solid #315c2b;
      border-radius: 8px;
      background: rgba(238, 252, 218, .94);
    }

    .quiz-word {
      font-size: clamp(26px, 3vw, 44px);
      font-weight: 1000;
      color: #173b27;
      overflow-wrap: anywhere;
    }

    .quiz-prompt {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      min-width: 0;
    }

    .quiz-thumb {
      display: grid;
      place-items: center;
      width: 72px;
      height: 72px;
      padding: 5px;
      border: 3px solid #6f8c3a;
      border-radius: 6px;
      background: #fffdf5;
    }

    .quiz-thumb img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
    }

    .answers {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .answer {
      min-height: 50px;
      border: 3px solid #6f8c3a;
      border-radius: 8px;
      background: #fffdf5;
      color: #173b27;
      font-size: 20px;
      font-weight: 1000;
    }

    .answer.correct { background: #caffaf; border-color: #269f3c; }
    .answer.wrong { background: #ffd1bd; border-color: #c54e35; }

    .reward-pop {
      animation: reward-pop .55s ease;
    }

    .reward-level-up {
      animation: reward-level-up 1.1s ease;
    }

    .reward-particle {
      position: fixed;
      z-index: 30;
      width: 9px;
      height: 9px;
      pointer-events: none;
      background: #65f2d6;
      box-shadow: 0 0 8px #fff7a5;
      animation: reward-fly .7s ease-out forwards;
    }

    @keyframes reward-pop {
      45% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }

    @keyframes reward-level-up {
      35% { transform: scale(1.06) rotate(2deg); filter: brightness(1.45); }
      70% { transform: scale(1.02) rotate(-1deg); }
      100% { transform: none; filter: none; }
    }

    @keyframes reward-fly {
      from { transform: translate(0, 0) scale(1); opacity: 1; }
      to { transform: translate(var(--fly-x), var(--fly-y)) scale(.25); opacity: 0; }
    }

    .feedback {
      min-height: 24px;
      font-weight: 1000;
      color: #894819;
    }

    .notice {
      margin: 0;
      padding: 4px 10px 8px;
      border-top: 2px solid rgba(111, 71, 37, .3);
      background: rgba(255, 248, 223, .96);
      color: #5c4829;
      font-size: 11px;
      font-weight: 800;
      text-align: center;
    }

    @media (max-width: 1240px) {
      header { padding: 10px 14px; }
      h1 { font-size: 32px; }
      .pill { min-height: 38px; padding: 6px 10px; }
      main { grid-template-columns: 190px minmax(0, 1fr); gap: 10px; padding: 10px; }
      .study-bar {
        grid-template-columns: minmax(110px, .35fr) minmax(180px, .55fr) minmax(0, 1.45fr);
        gap: 8px;
        padding: 8px;
      }
      .study-bar h2 { font-size: 25px; }
      .study-actions { display: none; }
      .core-reward {
        grid-template-columns: 46px minmax(110px, 1fr) minmax(150px, auto);
        padding: 6px;
      }
      .core-gem { width: 44px; height: 44px; }
      .reward-stats { gap: 5px; font-size: 11px; }
      .cards { grid-template-columns: repeat(4, minmax(120px, 1fr)); }
      .quiz {
        grid-template-columns: minmax(190px, 1fr) auto auto auto;
        padding: 8px;
      }
      .answers { grid-column: 1 / -1; }
      .answer { font-size: 17px; }
    }

    @media (max-width: 820px) {
      body {
        display: block;
        height: auto;
        min-height: 100vh;
        overflow: auto;
      }
      header { grid-template-columns: 1fr; }
      main {
        height: auto;
        grid-template-columns: 1fr;
      }
      .sidebar {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        max-height: 220px;
      }
      .theme-tab { margin: 0; }
      .study-bar { grid-template-columns: 1fr; }
      .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); max-height: none; }
      .quiz { grid-template-columns: 1fr; }
      .answers { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; }
      .reward-particle { display: none; }
    }
  </style>
</head>
<body data-show-en="true" data-study-mode="learn">
  <header>
    <div>
      <h1>Minecraft Chinese Reader</h1>
      <p class="subtitle">Tap a card to hear clear Mandarin pronunciation</p>
    </div>
    <div class="top-actions">
      <button class="pill" id="enToggle" type="button">Hide English</button>
      <button class="pill" id="voiceBtn" type="button">Chinese Voice</button>
      <a class="pill" href="/chinese/progress" style="text-decoration:none">My Progress</a>
      <button class="pill" id="logoutBtn" type="button">Log Out</button>
    </div>
  </header>

  <main>
    <nav class="sidebar" id="themeTabs" aria-label="Vocabulary themes"></nav>
    <section class="workspace">
      <section class="study-bar">
        <div>
          <h2 id="themeTitle">Loading...</h2>
          <p id="themeSubtitle"></p>
        </div>
        <div class="mode-switch" aria-label="Study mode">
          <button type="button" data-mode-button="learn">Study Mode</button>
          <button type="button" data-mode-button="quiz">Quiz Mode</button>
        </div>
        <div class="core-reward" id="rewardPanel">
          <div class="core-gem" id="rewardGem" aria-hidden="true"></div>
          <div>
            <h3 id="rewardTitle">Lv1 Coal Beginner</h3>
            <p id="rewardExp">0 / 120 EXP</p>
          </div>
          <div class="reward-stats">
            <span>Today <b id="rewardToday">0</b></span>
            <span>Streak <b id="rewardStreak">0</b></span>
            <span>Fixed <b id="rewardFixed">0</b></span>
          </div>
          <div class="reward-bar"><div class="reward-fill" id="rewardFill"></div></div>
        </div>
        <div class="study-actions">
          <button class="pill" id="speakThemeBtn" type="button">Hear Current Word</button>
        </div>
      </section>
      <section class="cards" id="cards" aria-live="polite"></section>
      <section class="quiz" id="quiz">
        <div class="quiz-prompt">
          <span class="quiz-thumb"><img id="quizImage" alt=""></span>
          <div>
            <div class="quiz-word" id="quizWord">Loading...</div>
            <div class="feedback" id="feedback"></div>
          </div>
        </div>
        <button class="pill" id="speakQuizBtn" type="button">Hear Chinese</button>
        <button class="pill" id="quizBtn" type="button">Next Question</button>
        <button class="pill" id="scrollTopBtn" type="button">Back to Cards</button>
        <div class="answers" id="answers"></div>
      </section>
    </section>
  </main>

  <p class="notice">Unofficial learning tool. Not affiliated with Mojang, Microsoft, or the official Minecraft brand.</p>

  <script>
    const TTS_VERSION = "20260731-zh-501002";
    const TTS_VOICE_TYPE = "501002";
    const englishPreferenceKey = "minecraft-chinese-reader-show-english";
    const gemThemes = {
      coal: { main: "#3f4548", dark: "#171a1c", light: "#9ca5a8", glow: "rgba(190,205,210,.55)" },
      iron: { main: "#c9d0d2", dark: "#6f777b", light: "#f6fbff", glow: "rgba(230,242,247,.62)" },
      gold: { main: "#f5c94d", dark: "#9c6a16", light: "#fff2a8", glow: "rgba(255,220,84,.72)" },
      redstone: { main: "#dc3f38", dark: "#7f1514", light: "#ff9f8f", glow: "rgba(255,78,62,.68)" },
      lapis: { main: "#356fdd", dark: "#183481", light: "#9ecbff", glow: "rgba(77,133,255,.7)" },
      emerald: { main: "#24c76a", dark: "#08733d", light: "#a5ffd0", glow: "rgba(57,239,135,.72)" },
      diamond: { main: "#49dce7", dark: "#138391", light: "#d5ffff", glow: "rgba(84,240,255,.78)" },
      netherite: { main: "#5d5166", dark: "#251d2b", light: "#c6b5d0", glow: "rgba(185,146,220,.65)" }
    };

    let themes = [];
    let currentThemeIndex = 0;
    let currentItem = null;
    let quizItem = null;
    let audio = null;
    let preloadObserver = null;
    let rewardState = null;

    const els = {
      themeTabs: document.querySelector("#themeTabs"),
      themeTitle: document.querySelector("#themeTitle"),
      themeSubtitle: document.querySelector("#themeSubtitle"),
      cards: document.querySelector("#cards"),
      quiz: document.querySelector("#quiz"),
      quizImage: document.querySelector("#quizImage"),
      quizWord: document.querySelector("#quizWord"),
      answers: document.querySelector("#answers"),
      feedback: document.querySelector("#feedback"),
      enToggle: document.querySelector("#enToggle"),
      voiceBtn: document.querySelector("#voiceBtn"),
      speakThemeBtn: document.querySelector("#speakThemeBtn"),
      speakQuizBtn: document.querySelector("#speakQuizBtn"),
      quizBtn: document.querySelector("#quizBtn"),
      scrollTopBtn: document.querySelector("#scrollTopBtn"),
      logoutBtn: document.querySelector("#logoutBtn"),
      rewardPanel: document.querySelector("#rewardPanel"),
      rewardGem: document.querySelector("#rewardGem"),
      rewardTitle: document.querySelector("#rewardTitle"),
      rewardExp: document.querySelector("#rewardExp"),
      rewardFill: document.querySelector("#rewardFill"),
      rewardToday: document.querySelector("#rewardToday"),
      rewardStreak: document.querySelector("#rewardStreak"),
      rewardFixed: document.querySelector("#rewardFixed"),
      modeButtons: document.querySelectorAll("[data-mode-button]")
    };

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, (character) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;"
      })[character]);
    }

    async function api(url, options = {}) {
      const response = await fetch(url, {
        ...options,
        headers: { "Content-Type": "application/json", ...(options.headers || {}) }
      });
      if (response.status === 401) {
        location.href = `/login?next=${encodeURIComponent("/chinese")}`;
        throw new Error("Please sign in");
      }
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || "Something went wrong");
      return data;
    }

    function makeTtsUrl(text) {
      return `/api/tts?${new URLSearchParams({ text, lang: "zh", voice: TTS_VOICE_TYPE, v: TTS_VERSION })}`;
    }

    function preloadTts(text) {
      if (!text) return;
      fetch(makeTtsUrl(text), { cache: "force-cache" }).catch(() => {});
    }

    async function speak(text) {
      if (!text) return;
      if (!audio) {
        audio = new Audio();
        audio.preload = "auto";
      }
      audio.pause();
      audio.currentTime = 0;
      audio.src = makeTtsUrl(text);
      els.voiceBtn.textContent = "Loading Voice...";
      try {
        await audio.play();
        els.voiceBtn.textContent = "Voice Ready";
      } catch {
        els.voiceBtn.textContent = "Try Again";
      }
    }

    function setEnglishVisible(visible) {
      document.body.dataset.showEn = visible ? "true" : "false";
      els.enToggle.textContent = visible ? "Hide English" : "Show English";
      els.enToggle.setAttribute("aria-pressed", String(!visible));
      localStorage.setItem(englishPreferenceKey, visible ? "true" : "false");
    }

    function setStudyMode(mode, shouldScroll = true) {
      document.body.dataset.studyMode = mode === "quiz" ? "quiz" : "learn";
      if (shouldScroll) {
        const target = mode === "quiz" ? els.quiz : els.cards;
        setTimeout(() => target.scrollIntoView({ behavior: "smooth", block: mode === "quiz" ? "end" : "start" }), 40);
      }
    }

    function gemSvg(theme) {
      return `<svg viewBox="0 0 64 64" role="img" aria-label="reward gem">
        <rect x="18" y="4" width="28" height="8" fill="${theme.light}"/>
        <rect x="10" y="12" width="44" height="10" fill="${theme.main}"/>
        <rect x="6" y="22" width="52" height="14" fill="${theme.dark}"/>
        <rect x="14" y="22" width="36" height="14" fill="${theme.main}"/>
        <rect x="18" y="36" width="28" height="14" fill="${theme.main}"/>
        <rect x="24" y="50" width="16" height="8" fill="${theme.dark}"/>
        <rect x="22" y="14" width="12" height="8" fill="${theme.light}"/>
        <rect x="40" y="24" width="8" height="10" fill="${theme.light}"/>
      </svg>`;
    }

    function renderReward(state) {
      if (!state) return;
      rewardState = state;
      const theme = gemThemes[state.gemKey] || gemThemes.coal;
      els.rewardPanel.style.setProperty("--gem-glow", theme.glow);
      els.rewardGem.innerHTML = gemSvg(theme);
      els.rewardTitle.textContent = `Lv${state.level} ${state.title}`;
      els.rewardExp.textContent = `${state.levelExp} / ${state.levelNeed} EXP`;
      els.rewardFill.style.width = `${state.progressPercent || 0}%`;
      els.rewardToday.textContent = state.todayExp || 0;
      els.rewardStreak.textContent = state.streakCorrect || 0;
      els.rewardFixed.textContent = state.fixedReviews || 0;
    }

    function spawnRewardParticles(source) {
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const from = (source || els.quiz).getBoundingClientRect();
      const to = els.rewardGem.getBoundingClientRect();
      for (let index = 0; index < 4; index += 1) {
        const particle = document.createElement("i");
        particle.className = "reward-particle";
        particle.style.left = `${from.left + from.width / 2 + index * 5}px`;
        particle.style.top = `${from.top + from.height / 2}px`;
        particle.style.setProperty("--fly-x", `${to.left + to.width / 2 - from.left - from.width / 2}px`);
        particle.style.setProperty("--fly-y", `${to.top + to.height / 2 - from.top - from.height / 2}px`);
        document.body.appendChild(particle);
        particle.addEventListener("animationend", () => particle.remove(), { once: true });
      }
    }

    function playRewardEvents(events = [], source) {
      if (!events.length) return;
      spawnRewardParticles(source);
      els.rewardPanel.classList.remove("reward-pop", "reward-level-up");
      void els.rewardPanel.offsetWidth;
      els.rewardPanel.classList.add(events.some((event) => event.type === "level_up") ? "reward-level-up" : "reward-pop");
    }

    function renderTabs() {
      els.themeTabs.innerHTML = themes.map((theme, index) => `
        <button class="theme-tab ${index === currentThemeIndex ? "active" : ""}" type="button" data-theme="${index}">
          <span class="tab-num">${String(index + 1).padStart(2, "0")}</span>
          <span class="tab-title">${escapeHtml(theme.title)}<small>${theme.items.length} words</small></span>
        </button>
      `).join("");
    }

    function observeCardAudio(theme) {
      preloadObserver?.disconnect();
      preloadObserver = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (!entry.isIntersecting) return;
          const item = theme.items[Number(entry.target.dataset.index)];
          preloadTts(item?.chinese);
          preloadObserver.unobserve(entry.target);
        });
      }, { root: els.cards, rootMargin: "100px" });
      els.cards.querySelectorAll(".word-card").forEach((card) => preloadObserver.observe(card));
      theme.items.slice(0, 10).forEach((item, index) => setTimeout(() => preloadTts(item.chinese), index * 140));
    }

    function renderCards() {
      const theme = themes[currentThemeIndex];
      els.cards.innerHTML = theme.items.map((item, index) => `
        <button class="word-card" type="button" data-index="${index}">
          <span class="thumb"><img src="${escapeHtml(item.image)}" alt="${escapeHtml(item.english)}"></span>
          <span class="word-meta"><b class="cn-text" lang="zh-CN">${escapeHtml(item.chinese)}</b><span class="en-text">${escapeHtml(item.english)}</span></span>
        </button>
      `).join("");
      els.cards.querySelectorAll(".word-card").forEach((card) => {
        card.addEventListener("click", async () => {
          const item = theme.items[Number(card.dataset.index)];
          currentItem = item;
          els.cards.querySelectorAll(".word-card.speaking").forEach((node) => node.classList.remove("speaking"));
          card.classList.add("speaking");
          setTimeout(() => card.classList.remove("speaking"), 500);
          speak(item.chinese);
          try {
            const data = await api("/api/chinese/progress/word", {
              method: "POST",
              body: JSON.stringify({ themeId: theme.id, itemId: item.id })
            });
            renderReward(data.rewardState);
          } catch (error) {
            els.feedback.textContent = error.message;
          }
        });
      });
      observeCardAudio(theme);
    }

    async function newQuiz() {
      const theme = themes[currentThemeIndex];
      els.feedback.textContent = "Loading question...";
      try {
        quizItem = await api("/api/chinese/quiz/next", {
          method: "POST",
          body: JSON.stringify({ themeId: theme.id })
        });
      } catch (error) {
        els.feedback.textContent = error.message;
        return;
      }
      currentItem = theme.items.find((item) => item.id === quizItem.itemId) || currentItem;
      els.quizWord.textContent = quizItem.english;
      els.quizImage.src = quizItem.image;
      els.quizImage.alt = quizItem.english;
      els.feedback.textContent = "Choose the Chinese answer.";
      els.answers.innerHTML = quizItem.options.map((option) => `
        <button class="answer" type="button" data-chinese="${escapeHtml(option)}" lang="zh-CN">${escapeHtml(option)}</button>
      `).join("");
      preloadTts(quizItem.speechText);
      let answered = false;
      els.answers.querySelectorAll(".answer").forEach((button) => {
        button.addEventListener("click", async () => {
          if (answered) return;
          answered = true;
          try {
            const data = await api("/api/chinese/quiz/answer", {
              method: "POST",
              body: JSON.stringify({
                themeId: theme.id,
                itemId: quizItem.itemId,
                selectedChinese: button.dataset.chinese
              })
            });
            els.answers.querySelectorAll(".answer").forEach((node) => {
              node.disabled = true;
              if (node.dataset.chinese === data.correctChinese) node.classList.add("correct");
            });
            if (!data.correct) button.classList.add("wrong");
            els.feedback.textContent = data.correct ? "Correct!" : `Correct answer: ${data.correctChinese}`;
            renderReward(data.rewardState);
            playRewardEvents(data.rewardEvents, button);
            speak(quizItem.speechText);
          } catch (error) {
            answered = false;
            els.feedback.textContent = error.message;
          }
        });
      });
    }

    async function setTheme(index) {
      currentThemeIndex = index;
      const theme = themes[index];
      currentItem = theme.items[0] || null;
      els.themeTitle.textContent = theme.title;
      els.themeSubtitle.textContent = `${theme.items.length} Chinese words`;
      renderTabs();
      renderCards();
      await newQuiz();
    }

    async function init() {
      setEnglishVisible(localStorage.getItem(englishPreferenceKey) !== "false");
      setStudyMode("learn", false);
      try {
        const [themeData, rewardData] = await Promise.all([
          api("/api/chinese/themes"),
          api("/api/chinese/rewards")
        ]);
        themes = themeData.themes || [];
        if (!themes.length) throw new Error("No Chinese vocabulary was found");
        renderReward(rewardData.rewardState);
        await setTheme(0);
      } catch (error) {
        els.themeTitle.textContent = "Unable to load";
        els.themeSubtitle.textContent = error.message;
      }
    }

    els.themeTabs.addEventListener("click", (event) => {
      const button = event.target.closest("[data-theme]");
      if (button) setTheme(Number(button.dataset.theme));
    });
    els.enToggle.addEventListener("click", () => setEnglishVisible(document.body.dataset.showEn === "false"));
    els.voiceBtn.addEventListener("click", () => speak(currentItem?.chinese));
    els.speakThemeBtn.addEventListener("click", () => speak(currentItem?.chinese));
    els.speakQuizBtn.addEventListener("click", () => speak(quizItem?.speechText));
    els.quizBtn.addEventListener("click", newQuiz);
    els.scrollTopBtn.addEventListener("click", () => {
      setStudyMode("learn");
      els.cards.scrollTo({ top: 0, behavior: "smooth" });
    });
    els.modeButtons.forEach((button) => button.addEventListener("click", () => setStudyMode(button.dataset.modeButton)));
    els.logoutBtn.addEventListener("click", async () => {
      await fetch("/api/auth/logout", { method: "POST" });
      location.href = "/login?next=%2Fchinese";
    });

    init();
  </script>
</body>
</html>
