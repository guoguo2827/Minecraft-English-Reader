<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>设置新密码 - Minecraft English Reader</title>
  <link rel="stylesheet" href="/portal.css">
</head>
<body>
  <main class="portal">
    <section class="portal-card">
      <h1 id="resetTitle">设置新密码</h1>
      <p id="resetIntro">请使用管理员给你的临时密码，设置一个新的登录密码。</p>
      <form id="passwordForm">
        <label><span id="currentPasswordLabel">临时密码</span><input name="currentPassword" type="password" autocomplete="current-password" required></label>
        <label><span id="newPasswordLabel">新密码</span><input name="newPassword" type="password" autocomplete="new-password" minlength="8" required></label>
        <label><span id="confirmPasswordLabel">确认新密码</span><input name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></label>
        <button id="savePasswordBtn" type="submit">保存新密码</button>
      </form>
      <p class="message" id="message"></p>
      <p class="notice" id="resetNotice">保存后请使用手机号和新密码登录。</p>
    </section>
  </main>
  <script>
    const form = document.querySelector("#passwordForm");
    const message = document.querySelector("#message");
    const requestedNext = new URLSearchParams(location.search).get("next") || "";
    const allowedNextPaths = new Set(["/", "/progress", "/chinese", "/chinese/progress", "/friends", "/access-status"]);
    const nextPath = allowedNextPaths.has(requestedNext) ? requestedNext : "/";
    const englishUi = nextPath === "/chinese" || nextPath === "/chinese/progress";
    if (englishUi) {
      document.documentElement.lang = "en";
      document.title = "Create New Password - Minecraft Chinese Reader";
      document.querySelector("#resetTitle").textContent = "Create a New Password";
      document.querySelector("#resetIntro").textContent = "Enter the temporary password from the administrator, then create a new password with at least 8 characters.";
      document.querySelector("#currentPasswordLabel").textContent = "Temporary Password";
      document.querySelector("#newPasswordLabel").textContent = "New Password";
      document.querySelector("#confirmPasswordLabel").textContent = "Confirm New Password";
      document.querySelector("#savePasswordBtn").textContent = "Save Password";
      document.querySelector("#resetNotice").textContent = "Use your phone number and new password the next time you sign in.";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const body = Object.fromEntries(new FormData(form).entries());
      if (body.newPassword !== body.confirmPassword) {
        message.textContent = englishUi ? "The two passwords do not match" : "两次输入的新密码不一致";
        return;
      }
      message.textContent = englishUi ? "Saving..." : "正在保存...";
      const response = await fetch("/api/auth/change-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        message.textContent = data.error || (englishUi ? "Unable to save password" : "保存失败");
        return;
      }
      message.textContent = englishUi ? "Password saved. Opening your course..." : "新密码已保存，正在进入学习页...";
      location.href = nextPath;
    });
  </script>
</body>
</html>
