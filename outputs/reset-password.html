<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>设置新密码 - Minecraft English Reader</title>
  <link rel="stylesheet" href="/portal.css">
</head>
<body>
  <main class="portal">
    <section class="portal-card">
      <h1 id="resetTitle">设置新密码</h1>
      <p id="resetIntro">临时密码已验证，请设置一个新的登录密码。</p>
      <form id="passwordForm" novalidate>
        <label><span id="newPasswordLabel">新密码</span><input name="newPassword" type="password" autocomplete="new-password" minlength="8" required></label>
        <label><span id="confirmPasswordLabel">确认新密码</span><input name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></label>
        <button id="savePasswordBtn" type="submit">保存新密码</button>
      </form>
      <p class="message" id="message" aria-live="polite"></p>
      <p class="notice" id="resetNotice">保存后会直接进入学习页面，下次请使用新密码登录。</p>
    </section>
  </main>
  <script>
    const form = document.querySelector("#passwordForm");
    const message = document.querySelector("#message");
    const saveButton = document.querySelector("#savePasswordBtn");
    const requestedNext = new URLSearchParams(location.search).get("next") || "";
    const allowedNextPaths = new Set(["/", "/progress", "/chinese", "/chinese/progress", "/friends", "/access-status"]);
    const nextPath = allowedNextPaths.has(requestedNext) ? requestedNext : "/";
    const englishUi = nextPath === "/chinese" || nextPath === "/chinese/progress";
    if (englishUi) {
      document.documentElement.lang = "en";
      document.title = "Create New Password - Minecraft Chinese Reader";
      document.querySelector("#resetTitle").textContent = "Create a New Password";
      document.querySelector("#resetIntro").textContent = "Your temporary password has been verified. Create a new password with at least 8 characters.";
      document.querySelector("#newPasswordLabel").textContent = "New Password";
      document.querySelector("#confirmPasswordLabel").textContent = "Confirm New Password";
      document.querySelector("#savePasswordBtn").textContent = "Save Password";
      document.querySelector("#resetNotice").textContent = "You will enter the course after saving. Use the new password next time.";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const body = Object.fromEntries(new FormData(form).entries());
      if (String(body.newPassword || "").length < 8) {
        message.textContent = englishUi ? "Use at least 8 characters" : "新密码至少需要 8 位";
        form.elements.newPassword.focus();
        return;
      }
      if (body.newPassword !== body.confirmPassword) {
        message.textContent = englishUi ? "The two passwords do not match" : "两次输入的新密码不一致";
        return;
      }
      saveButton.disabled = true;
      saveButton.textContent = englishUi ? "Saving..." : "正在保存...";
      message.textContent = englishUi ? "Saving..." : "正在保存...";
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 15000);
      let navigating = false;
      try {
        const response = await fetch("/api/auth/complete-password-reset", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
          signal: controller.signal
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          message.textContent = data.error || (englishUi ? "Unable to save password" : "保存失败，请重试");
          return;
        }
        message.textContent = englishUi ? "Password saved. Opening your course..." : "新密码已保存，正在进入学习页...";
        navigating = true;
        location.replace(nextPath);
      } catch (error) {
        message.textContent = error.name === "AbortError"
          ? (englishUi ? "Connection timed out. Please try again." : "连接超时，请重试。")
          : (englishUi ? "Network error. Please try again." : "网络连接失败，请重试。");
      } finally {
        clearTimeout(timeout);
        if (!navigating) {
          saveButton.disabled = false;
          saveButton.textContent = englishUi ? "Save Password" : "保存新密码";
        }
      }
    });

    addEventListener("pageshow", () => {
      saveButton.disabled = false;
      saveButton.textContent = englishUi ? "Save Password" : "保存新密码";
    });
  </script>
</body>
</html>
