<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 - Minecraft English Reader</title>
  <link rel="stylesheet" href="/portal.css">
</head>
<body>
  <main class="portal">
    <section class="portal-card">
      <h1 id="productTitle">Minecraft English Reader</h1>
      <p id="productSubtitle">好友小范围英语点读学习</p>
      <form id="loginForm" novalidate>
        <label><span id="phoneLabel">手机号</span><input name="phone" inputmode="numeric" autocomplete="tel" maxlength="11" pattern="1[3-9][0-9]{9}" required></label>
        <label><span id="passwordLabel">密码</span><input name="password" type="password" autocomplete="current-password" required></label>
        <label class="check-line"><input name="remember" type="checkbox"><span id="rememberLabel">记住手机号</span></label>
        <button id="loginButton" type="submit">登录</button>
      </form>
      <p class="portal-link" id="registerCopy">第一次使用？<a id="registerLink" href="/register">用邀请码注册</a></p>
      <p class="portal-link" id="forgotCopy">忘记密码？请联系管理员重置，拿到临时密码后登录并设置新密码。</p>
      <p class="message" id="message" aria-live="polite"></p>
      <p class="notice" id="unofficialNotice">非官方学习工具，与 Mojang、Microsoft、Minecraft 官方无关联。</p>
    </section>
  </main>
  <script>
    const form = document.querySelector("#loginForm");
    const message = document.querySelector("#message");
    const loginButton = document.querySelector("#loginButton");
    const registerLink = document.querySelector("#registerLink");
    const rememberKey = "minecraft-reader-login";
    const requestedNext = new URLSearchParams(location.search).get("next") || "";
    const allowedNextPaths = new Set(["/", "/progress", "/chinese", "/chinese/progress", "/friends", "/access-status"]);
    const nextPath = allowedNextPaths.has(requestedNext) ? requestedNext : "/";
    if (nextPath !== "/") registerLink.href = `/register?next=${encodeURIComponent(nextPath)}`;
    const englishUi = nextPath === "/chinese" || nextPath === "/chinese/progress";
    if (englishUi) {
      document.documentElement.lang = "en";
      document.title = "Sign In - Minecraft Chinese Reader";
      document.querySelector("#productTitle").textContent = "Minecraft Chinese Reader";
      document.querySelector("#productSubtitle").textContent = "Learn Mandarin with Minecraft-style word cards";
      document.querySelector("#phoneLabel").textContent = "Phone Number";
      document.querySelector("#passwordLabel").textContent = "Password";
      document.querySelector("#rememberLabel").textContent = "Remember phone number";
      document.querySelector("#loginButton").textContent = "Sign In";
      document.querySelector("#registerCopy").firstChild.textContent = "First time here? ";
      registerLink.textContent = "Register with an invitation";
      document.querySelector("#forgotCopy").textContent = "Forgot your password? Ask the administrator for a temporary password, then sign in and create a new one.";
      document.querySelector("#unofficialNotice").textContent = "Unofficial learning tool. Not affiliated with Mojang, Microsoft or the official Minecraft brand.";
    }

    function loadRememberedLogin() {
      let saved = null;
      try {
        saved = JSON.parse(localStorage.getItem(rememberKey) || "null");
      } catch {
        localStorage.removeItem(rememberKey);
      }
      if (!saved) return;
      form.elements.phone.value = saved.phone || saved.username || "";
      form.elements.remember.checked = true;
      if (saved.password) {
        form.elements.password.value = saved.password;
        localStorage.setItem(rememberKey, JSON.stringify({ phone: form.elements.phone.value }));
        message.textContent = englishUi
          ? "Your previously remembered password was restored for this sign-in."
          : "已恢复原来记住的密码，请直接登录一次。";
      }
    }

    function saveRememberedLogin(body) {
      if (form.elements.remember.checked) {
        localStorage.setItem(rememberKey, JSON.stringify({
          phone: body.phone
        }));
      } else {
        localStorage.removeItem(rememberKey);
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const body = Object.fromEntries(new FormData(form).entries());
      body.phone = String(body.phone || "").normalize("NFKC").replace(/\D/g, "").slice(0, 11);
      body.password = String(body.password || "");
      if (!/^1[3-9]\d{9}$/.test(body.phone)) {
        message.textContent = englishUi ? "Enter a valid phone number" : "请输入正确的 11 位手机号";
        form.elements.phone.focus();
        return;
      }
      if (!body.password) {
        message.textContent = englishUi ? "Enter your password" : "请输入密码";
        form.elements.password.focus();
        return;
      }
      loginButton.disabled = true;
      loginButton.textContent = englishUi ? "Signing in..." : "正在登录...";
      message.textContent = englishUi ? "Signing in..." : "正在登录...";
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 15000);
      let navigating = false;
      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
          signal: controller.signal
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          message.textContent = data.error || (englishUi ? "Sign-in failed" : "登录失败，请重试");
          return;
        }
        saveRememberedLogin(body);
        navigating = true;
        location.replace(data.user?.passwordResetRequired
          ? `/reset-password?next=${encodeURIComponent(nextPath)}`
          : nextPath);
      } catch (error) {
        message.textContent = error.name === "AbortError"
          ? (englishUi ? "Connection timed out. Please try again." : "连接超时，请重试。")
          : (englishUi ? "Network error. Please try again." : "网络连接失败，请重试。");
      } finally {
        clearTimeout(timeout);
        if (!navigating) {
          loginButton.disabled = false;
          loginButton.textContent = englishUi ? "Sign In" : "登录";
        }
      }
    });

    form.elements.phone.addEventListener("input", () => {
      form.elements.phone.value = form.elements.phone.value.normalize("NFKC").replace(/\D/g, "").slice(0, 11);
    });

    addEventListener("pageshow", () => {
      loginButton.disabled = false;
      loginButton.textContent = englishUi ? "Sign In" : "登录";
    });

    loadRememberedLogin();
  </script>
</body>
</html>
