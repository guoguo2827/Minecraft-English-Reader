<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理后台 - Minecraft Reader</title>
  <link rel="stylesheet" href="/portal.css">
</head>
<body>
  <main class="shell">
    <section class="panel wide admin-panel">
      <div class="top admin-top">
        <div>
          <h1>管理后台</h1>
          <p id="adminLine">公共账号管理与课程学习统计</p>
        </div>
        <div class="actions">
          <a href="/">英文学习</a>
          <a href="/chinese">中文学习</a>
        </div>
      </div>

      <nav class="course-switch admin-course-tabs" aria-label="统计课程">
        <button type="button" data-course="english">英文点读课程</button>
        <button type="button" data-course="chinese">中文点读课程</button>
      </nav>

      <section class="admin-section" aria-labelledby="courseHeading">
        <div class="section-heading">
          <div>
            <p class="section-kicker">课程数据</p>
            <h2 id="courseHeading">英文点读课程概览</h2>
          </div>
          <span class="course-badge" id="courseBadge">English</span>
        </div>
        <div class="admin-summary-grid" id="courseSummary" aria-live="polite"></div>

        <div class="section-heading user-heading">
          <div>
            <p class="section-kicker">按用户查看</p>
            <h2 id="usersHeading">英文课程用户进度</h2>
          </div>
        </div>
        <div class="toolbar">
          <label>按手机号搜索<input id="userPhoneSearch" inputmode="numeric" autocomplete="off" maxlength="11" placeholder="输入手机号或部分号码"></label>
          <label>用户类型<select id="userAccessFilter"><option value="">全部</option><option value="founder_trial">创始体验</option><option value="free_trial">免费体验</option><option value="expired">已到期</option></select></label>
          <label>主课程<select id="userPrimaryFilter"><option value="">全部</option><option value="english">英文</option><option value="chinese">中文</option></select></label>
          <button class="secondary" id="userSearchBtn" type="button">搜索</button>
        </div>
        <div class="list" id="users"></div>
        <div class="pager">
          <button class="secondary" id="prevUsersBtn" type="button">上一页</button>
          <span id="usersPageInfo">第 1 页</span>
          <button class="secondary" id="nextUsersBtn" type="button">下一页</button>
        </div>
      </section>

      <section class="admin-section shared-admin" aria-labelledby="sharedHeading">
        <div class="section-heading">
          <div>
            <p class="section-kicker">两门课程共用</p>
            <h2 id="sharedHeading">公共账号与邀请管理</h2>
          </div>
          <span class="shared-badge">账号共用 · 进度隔离</span>
        </div>

        <h3>新增手机白名单</h3>
        <form id="whitelistForm" class="whitelist-form">
          <label>手机号<input name="phone" inputmode="numeric" autocomplete="off" maxlength="11" pattern="1[3-9][0-9]{9}" placeholder="请输入11位手机号" required></label>
          <label>备注<input name="note" placeholder="好友姓名或来源"></label>
          <label>主课程<select name="primaryCourse"><option value="english">英文点读</option><option value="chinese">中文点读</option></select></label>
          <button type="submit">生成邀请码</button>
        </form>
        <p class="message" id="message"></p>

        <h3>白名单与邀请码</h3>
        <div class="list" id="whitelist"></div>
        <div class="pager">
          <button class="secondary" id="prevWhitelistBtn" type="button">上一页</button>
          <span id="whitelistPageInfo">第 1 页</span>
          <button class="secondary" id="nextWhitelistBtn" type="button">下一页</button>
        </div>
      </section>

      <section class="admin-section" aria-labelledby="applicationsHeading">
        <div class="section-heading"><div><p class="section-kicker">公开体验</p><h2 id="applicationsHeading">待审核注册申请</h2></div></div>
        <div class="list" id="applications"></div>
        <div class="pager"><button class="secondary" id="prevApplicationsBtn" type="button">上一页</button><span id="applicationsPageInfo">第 1 页</span><button class="secondary" id="nextApplicationsBtn" type="button">下一页</button></div>
      </section>

      <section class="admin-section" aria-labelledby="auditHeading">
        <div class="section-heading"><div><p class="section-kicker">安全追踪</p><h2 id="auditHeading">管理员操作日志</h2></div></div>
        <div class="toolbar"><label>操作类型<input id="auditAction" placeholder="例如 user.access"></label><button class="secondary" id="auditSearchBtn" type="button">筛选</button></div>
        <div class="list audit-list" id="auditLogs"></div>
        <div class="pager"><button class="secondary" id="prevAuditBtn" type="button">上一页</button><span id="auditPageInfo">第 1 页</span><button class="secondary" id="nextAuditBtn" type="button">下一页</button></div>
      </section>
    </section>
  </main>

  <div class="admin-modal" id="userDetailModal" hidden>
    <button class="admin-modal-backdrop" type="button" data-close-detail aria-label="关闭用户明细"></button>
    <section class="admin-modal-content" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
      <div class="top">
        <div>
          <p class="section-kicker" id="detailCourse"></p>
          <h2 id="detailTitle">用户课程明细</h2>
        </div>
        <button class="icon-close" type="button" data-close-detail aria-label="关闭">×</button>
      </div>
      <div id="userDetailBody"></div>
    </section>
  </div>

  <script>
    const form = document.querySelector("#whitelistForm");
    const phoneInput = form.elements.phone;
    const message = document.querySelector("#message");
    const prevWhitelistBtn = document.querySelector("#prevWhitelistBtn");
    const nextWhitelistBtn = document.querySelector("#nextWhitelistBtn");
    const whitelistPageInfo = document.querySelector("#whitelistPageInfo");
    const userPhoneSearch = document.querySelector("#userPhoneSearch");
    const userSearchBtn = document.querySelector("#userSearchBtn");
    const userAccessFilter = document.querySelector("#userAccessFilter");
    const userPrimaryFilter = document.querySelector("#userPrimaryFilter");
    const prevUsersBtn = document.querySelector("#prevUsersBtn");
    const nextUsersBtn = document.querySelector("#nextUsersBtn");
    const usersPageInfo = document.querySelector("#usersPageInfo");
    const userDetailModal = document.querySelector("#userDetailModal");
    const userDetailBody = document.querySelector("#userDetailBody");
    const applications = document.querySelector("#applications");
    const prevApplicationsBtn = document.querySelector("#prevApplicationsBtn");
    const nextApplicationsBtn = document.querySelector("#nextApplicationsBtn");
    const applicationsPageInfo = document.querySelector("#applicationsPageInfo");
    const auditLogs = document.querySelector("#auditLogs");
    const auditAction = document.querySelector("#auditAction");
    const auditSearchBtn = document.querySelector("#auditSearchBtn");
    const prevAuditBtn = document.querySelector("#prevAuditBtn");
    const nextAuditBtn = document.querySelector("#nextAuditBtn");
    const auditPageInfo = document.querySelector("#auditPageInfo");
    const requestedCourse = new URLSearchParams(location.search).get("course");
    let userCourse = requestedCourse === "chinese" ? "chinese" : "english";
    let whitelistItems = [];
    let whitelistPage = 1;
    let whitelistTotalPages = 1;
    let userItems = [];
    let usersPage = 1;
    let usersTotalPages = 1;
    let applicationsPage = 1;
    let applicationsTotalPages = 1;
    let auditPage = 1;
    let auditTotalPages = 1;
    const listPageSize = 10;

    const courseCopy = {
      english: { heading: "英文点读课程概览", users: "英文课程用户进度", badge: "English", label: "英文课程" },
      chinese: { heading: "中文点读课程概览", users: "中文课程用户进度", badge: "Chinese", label: "中文课程" }
    };

    async function api(url, options = {}) {
      const response = await fetch(url, {
        ...options,
        headers: { "Content-Type": "application/json", ...(options.headers || {}) }
      });
      if (response.status === 401) {
        location.href = "/admin-login";
        throw new Error("请重新登录管理后台");
      }
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || "操作失败");
      return data;
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>'"]/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;"
      })[char]);
    }

    function formatDate(value) {
      if (!value) return "暂无记录";
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? escapeHtml(value) : date.toLocaleString("zh-CN", { hour12: false });
    }

    function statusText(status) {
      return { unused: "未使用", used: "已使用", disabled: "已禁用", active: "正常", free_trial: "免费体验", founder_trial: "创始体验", expired: "已到期" }[status] || status;
    }

    function courseText(course) { return course === "chinese" ? "中文" : "英文"; }

    function inviteMessage(item) {
      return [
        "Minecraft Reader 注册信息",
        `注册链接：${location.origin}/register`,
        `手机号：${item.phone}`,
        `邀请码：${item.inviteCode}`,
        "一个账号可使用英文和中文课程，首次注册后邀请码自动失效。"
      ].join("\n");
    }

    async function copyText(text) {
      if (navigator.clipboard?.writeText) {
        await navigator.clipboard.writeText(text);
        return;
      }
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.position = "fixed";
      textarea.style.opacity = "0";
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand("copy");
      textarea.remove();
    }

    async function loadCourseSummary() {
      const data = await api(`/api/admin/course-summary?course=${userCourse}`);
      const metrics = [
        ["课程主题", data.themeCount],
        ["课程词汇", data.vocabularySize],
        ["学习用户", `${data.learnerCount}/${data.totalUsers}`],
        ["累计点读", data.readCount],
        ["答题正确率", `${data.accuracy}%`],
        ["待复习错题", data.reviewCount]
      ];
      document.querySelector("#courseSummary").innerHTML = metrics.map(([label, value]) => `
        <div class="admin-stat"><span>${label}</span><strong>${value}</strong></div>
      `).join("") + `<div class="summary-foot">累计掌握 ${data.masteredWords} 个词 · 累计答题 ${data.answerCount} 次 · 最近学习 ${formatDate(data.lastStudiedAt)}</div>`;
    }

    async function loadWhitelist(page = whitelistPage) {
      const params = new URLSearchParams({ page: String(page), pageSize: String(listPageSize) });
      const data = await api(`/api/admin/whitelist?${params}`);
      whitelistItems = data.items;
      whitelistPage = data.page;
      whitelistTotalPages = data.totalPages;
      document.querySelector("#whitelist").innerHTML = data.items.map((item) => `
        <div class="row">
          <div>
            <strong>${escapeHtml(item.phone)}</strong>
            <div class="muted">${escapeHtml(item.note || "无备注")} · 主课程：${courseText(item.primaryCourse)} · ${statusText(item.status)} · 邀请码：${escapeHtml(item.inviteCode || "已失效")}</div>
          </div>
          ${item.status === "unused" ? `<div class="actions"><button class="secondary" data-copy-white="${item.id}">复制</button><button class="danger" data-disable-white="${item.id}">禁用</button></div>` : ""}
          ${item.status === "disabled" ? `<div class="actions"><button class="secondary" data-restore-white="${item.id}">恢复使用</button></div>` : ""}
        </div>
      `).join("") || "<p>暂无白名单</p>";
      whitelistPageInfo.textContent = `第 ${data.page} / ${data.totalPages} 页，共 ${data.total} 个名单`;
      prevWhitelistBtn.disabled = data.page <= 1;
      nextWhitelistBtn.disabled = data.page >= data.totalPages;
    }

    async function loadUsers(page = usersPage) {
      const phone = userPhoneSearch.value.trim();
      const params = new URLSearchParams({
        page: String(page),
        pageSize: String(listPageSize),
        course: userCourse
      });
      if (phone) params.set("phone", phone);
      if (userAccessFilter.value) params.set("accessState", userAccessFilter.value);
      if (userPrimaryFilter.value) params.set("primaryCourse", userPrimaryFilter.value);
      const data = await api(`/api/admin/users?${params}`);
      userItems = data.items;
      usersPage = data.page;
      usersTotalPages = data.totalPages;
      document.querySelector("#users").innerHTML = data.items.map((user) => {
        const progress = user.progress;
        return `
          <div class="row user-admin-row">
            <div>
              <div class="user-title"><strong>${escapeHtml(user.phone || user.username)}</strong><span class="status-chip ${user.status}">${statusText(user.status)}</span></div>
              <div class="muted">${escapeHtml(user.social_name || "未生成好友名")} · ${statusText(user.accessState)} · 主课程：${courseText(user.primary_course)} · 已邀请 ${user.referral_success_count}/${user.referral_max_uses}${user.trial_expires_at ? ` · 到期：${formatDate(user.trial_expires_at)}` : ""}</div>
              <div class="muted">${escapeHtml(user.role)}${user.password_reset_required ? " · 待设置新密码" : ""} · 掌握 ${progress.masteredWords}/${progress.totalWords} · 正确率 ${progress.accuracy}% · 错题 ${progress.reviewCount}</div>
              <div class="muted">最近学习：${formatDate(progress.lastStudiedAt)} · 最后登录：${formatDate(user.last_login_at)}</div>
            </div>
            <div class="actions">
              <button class="secondary" data-progress-user="${user.id}">主题明细</button>
              ${user.role !== "admin" ? `<select aria-label="用户类型" data-access-state="${user.id}"><option value="founder_trial" ${user.accessState === "founder_trial" ? "selected" : ""}>创始体验</option><option value="free_trial" ${user.accessState === "free_trial" ? "selected" : ""}>免费体验</option><option value="expired" ${user.accessState === "expired" ? "selected" : ""}>已到期</option></select><select aria-label="主课程" data-primary-course="${user.id}"><option value="english" ${user.primary_course === "english" ? "selected" : ""}>英文</option><option value="chinese" ${user.primary_course === "chinese" ? "selected" : ""}>中文</option></select><input aria-label="体验到期日" data-trial-expires="${user.id}" type="date" value="${user.trial_expires_at ? escapeHtml(user.trial_expires_at.slice(0, 10)) : ""}"><button class="secondary" data-save-access="${user.id}">保存权益</button><button class="secondary" data-reset-user="${user.id}">重置密码</button><button class="${user.status === "active" ? "danger" : "secondary"}" data-user="${user.id}" data-status="${user.status === "active" ? "disabled" : "active"}">${user.status === "active" ? "禁用" : "启用"}</button>` : ""}
            </div>
          </div>`;
      }).join("") || "<p>暂无用户</p>";
      usersPageInfo.textContent = `第 ${data.page} / ${data.totalPages} 页，共 ${data.total} 个用户`;
      prevUsersBtn.disabled = data.page <= 1;
      nextUsersBtn.disabled = data.page >= data.totalPages;
    }

    async function loadApplications(page = applicationsPage) {
      const data = await api(`/api/admin/registration-applications?status=pending&page=${page}&pageSize=${listPageSize}`);
      applicationsPage = data.page;
      applicationsTotalPages = data.totalPages;
      applications.innerHTML = data.items.map((item) => `<div class="row"><div><strong>${escapeHtml(item.phone)}</strong><div class="muted">${escapeHtml(item.socialName)} · ${courseText(item.primaryCourse)} · 邀请人 ${escapeHtml(item.inviterSocialName)} · ${formatDate(item.createdAt)}</div></div><div class="actions"><button data-approve-application="${item.id}">批准</button><button class="danger" data-reject-application="${item.id}">拒绝</button></div></div>`).join("") || "<p>暂无待审核申请</p>";
      applicationsPageInfo.textContent = `第 ${data.page} / ${data.totalPages} 页，共 ${data.total} 个申请`;
      prevApplicationsBtn.disabled = data.page <= 1;
      nextApplicationsBtn.disabled = data.page >= data.totalPages;
    }

    async function loadAuditLogs(page = auditPage) {
      const params = new URLSearchParams({ page: String(page), pageSize: "20" });
      if (auditAction.value.trim()) params.set("action", auditAction.value.trim());
      const data = await api(`/api/admin/audit-logs?${params}`);
      auditPage = data.page;
      auditTotalPages = data.totalPages;
      auditLogs.innerHTML = data.items.map((item) => `<div class="row"><div><strong>${escapeHtml(item.action)}</strong><div class="muted">${escapeHtml(item.adminUsername || "system")} · ${escapeHtml(item.targetType || "-")} #${escapeHtml(item.targetId || "-")} · ${formatDate(item.createdAt)}</div></div></div>`).join("") || "<p>暂无操作日志</p>";
      auditPageInfo.textContent = `第 ${data.page} / ${data.totalPages} 页，共 ${data.total} 条`;
      prevAuditBtn.disabled = data.page <= 1;
      nextAuditBtn.disabled = data.page >= data.totalPages;
    }

    async function showUserDetail(userId) {
      userDetailModal.hidden = false;
      userDetailBody.innerHTML = '<p class="detail-loading">正在加载课程明细...</p>';
      const data = await api(`/api/admin/users/${userId}/progress?course=${userCourse}`);
      const copy = courseCopy[userCourse];
      document.querySelector("#detailCourse").textContent = copy.label;
      document.querySelector("#detailTitle").textContent = `${data.user.phone || data.user.username} 的学习明细`;
      const totals = data.progress.totals;
      userDetailBody.innerHTML = `
        <div class="detail-summary">
          <div class="admin-stat"><span>课程完成率</span><strong>${totals.completion}%</strong></div>
          <div class="admin-stat"><span>答题正确率</span><strong>${totals.accuracy}%</strong></div>
          <div class="admin-stat"><span>待复习错题</span><strong>${totals.reviewCount}</strong></div>
          <div class="admin-stat"><span>奖励等级</span><strong>Lv${data.reward.level}</strong><small>${escapeHtml(data.reward.title)} · ${data.reward.totalEmeralds ?? data.reward.totalExp ?? 0} ${escapeHtml(data.reward.currencyLabel || "绿宝石")}</small></div>
        </div>
        <div class="theme-progress-list">
          ${data.progress.themes.map((theme) => `
            <div class="theme-progress-row">
              <div class="theme-progress-copy"><strong>${escapeHtml(theme.title)}</strong><span>${theme.masteredWords}/${theme.totalWords} 已掌握 · 正确率 ${theme.accuracy}% · 错题 ${theme.reviewCount}</span></div>
              <div class="progress-track" aria-label="${escapeHtml(theme.title)} 完成率 ${theme.completion}%"><i style="width:${theme.completion}%"></i></div>
              <b>${theme.completion}%</b>
            </div>
          `).join("")}
        </div>`;
    }

    function closeUserDetail() {
      userDetailModal.hidden = true;
      userDetailBody.innerHTML = "";
    }

    async function setCourse(course) {
      userCourse = course === "chinese" ? "chinese" : "english";
      const copy = courseCopy[userCourse];
      document.querySelectorAll("[data-course]").forEach((button) => {
        const active = button.dataset.course === userCourse;
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", String(active));
      });
      document.querySelector("#courseHeading").textContent = copy.heading;
      document.querySelector("#usersHeading").textContent = copy.users;
      document.querySelector("#courseBadge").textContent = copy.badge;
      const url = new URL(location.href);
      url.searchParams.set("course", userCourse);
      history.replaceState(null, "", url);
      closeUserDetail();
      await Promise.all([loadCourseSummary(), loadUsers(1)]);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const phone = phoneInput.value.trim();
      if (!/^1[3-9]\d{9}$/.test(phone)) {
        message.textContent = "请输入正确的11位手机号";
        phoneInput.focus();
        return;
      }
      message.textContent = "正在生成...";
      try {
        const body = Object.fromEntries(new FormData(form).entries());
        const item = await api("/api/admin/whitelist", { method: "POST", body: JSON.stringify(body) });
        message.textContent = `邀请码：${item.inviteCode}`;
        form.reset();
        await loadWhitelist(1);
      } catch (error) {
        message.textContent = error.message;
      }
    });

    phoneInput.addEventListener("input", () => {
      phoneInput.value = phoneInput.value.replace(/\D/g, "").slice(0, 11);
    });

    document.addEventListener("click", async (event) => {
      const courseButton = event.target.closest("[data-course]");
      const copyButton = event.target.closest("[data-copy-white]");
      const whiteButton = event.target.closest("[data-disable-white]");
      const restoreWhiteButton = event.target.closest("[data-restore-white]");
      const userButton = event.target.closest("[data-user]");
      const resetButton = event.target.closest("[data-reset-user]");
      const progressButton = event.target.closest("[data-progress-user]");
      const saveAccessButton = event.target.closest("[data-save-access]");
      const approveApplicationButton = event.target.closest("[data-approve-application]");
      const rejectApplicationButton = event.target.closest("[data-reject-application]");
      const closeButton = event.target.closest("[data-close-detail]");
      try {
        if (courseButton) return void await setCourse(courseButton.dataset.course);
        if (closeButton) return closeUserDetail();
        if (progressButton) return void await showUserDetail(progressButton.dataset.progressUser);
        if (saveAccessButton) {
          const id = saveAccessButton.dataset.saveAccess;
          const accessState = document.querySelector(`[data-access-state="${id}"]`).value;
          const primaryCourse = document.querySelector(`[data-primary-course="${id}"]`).value;
          const trialDate = document.querySelector(`[data-trial-expires="${id}"]`).value;
          const trialExpiresAt = trialDate ? `${trialDate}T23:59:59+08:00` : null;
          await api(`/api/admin/users/${id}/access`, { method: "PATCH", body: JSON.stringify({ accessState, primaryCourse, trialExpiresAt }) });
          message.textContent = "用户权益已更新";
          await loadUsers();
          return;
        }
        if (approveApplicationButton) {
          if (!confirm("批准后将创建正式账号并开始14天体验，确定继续吗？")) return;
          await api(`/api/admin/registration-applications/${approveApplicationButton.dataset.approveApplication}/approve`, { method: "POST", body: "{}" });
          message.textContent = "申请已批准";
          await Promise.all([loadApplications(), loadUsers(1)]);
          return;
        }
        if (rejectApplicationButton) {
          const reason = prompt("请输入拒绝原因（可留空）", "") ?? null;
          if (reason === null) return;
          await api(`/api/admin/registration-applications/${rejectApplicationButton.dataset.rejectApplication}/reject`, { method: "POST", body: JSON.stringify({ reason }) });
          message.textContent = "申请已拒绝";
          await loadApplications();
          return;
        }
        if (copyButton) {
          const item = whitelistItems.find((entry) => String(entry.id) === copyButton.dataset.copyWhite);
          if (!item?.inviteCode) return void (message.textContent = "邀请码已失效，无法复制");
          await copyText(inviteMessage(item));
          message.textContent = `已复制 ${item.phone} 的邀请信息`;
          return;
        }
        if (whiteButton) {
          await api(`/api/admin/whitelist/${whiteButton.dataset.disableWhite}`, { method: "PATCH", body: JSON.stringify({ status: "disabled" }) });
          await loadWhitelist();
        }
        if (restoreWhiteButton) {
          await api(`/api/admin/whitelist/${restoreWhiteButton.dataset.restoreWhite}`, { method: "PATCH", body: JSON.stringify({ status: "unused" }) });
          message.textContent = "白名单已恢复使用";
          await loadWhitelist();
        }
        if (userButton) {
          await api(`/api/admin/users/${userButton.dataset.user}`, { method: "PATCH", body: JSON.stringify({ status: userButton.dataset.status }) });
          await loadUsers();
          await loadCourseSummary();
        }
        if (resetButton) {
          const user = userItems.find((item) => String(item.id) === resetButton.dataset.resetUser);
          if (!confirm(`确定重置 ${user?.phone || user?.username || "该用户"} 的密码吗？`)) return;
          const data = await api(`/api/admin/users/${resetButton.dataset.resetUser}/reset-password`, { method: "POST", body: "{}" });
          await copyText(`登录地址：${location.origin}/login\n手机号：${data.phone || data.username}\n临时密码：${data.password}\n请登录后设置新密码。`);
          message.textContent = `已重置 ${data.phone || data.username} 的密码，临时密码已复制`;
        }
      } catch (error) {
        message.textContent = error.message;
        if (!userDetailModal.hidden) userDetailBody.innerHTML = `<p class="message">${escapeHtml(error.message)}</p>`;
      }
    });

    userPhoneSearch.addEventListener("input", () => {
      userPhoneSearch.value = userPhoneSearch.value.replace(/\D/g, "").slice(0, 11);
    });
    userSearchBtn.addEventListener("click", () => loadUsers(1));
    userPhoneSearch.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        loadUsers(1);
      }
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !userDetailModal.hidden) closeUserDetail();
    });
    prevUsersBtn.addEventListener("click", () => loadUsers(Math.max(1, usersPage - 1)));
    nextUsersBtn.addEventListener("click", () => loadUsers(Math.min(usersTotalPages, usersPage + 1)));
    prevWhitelistBtn.addEventListener("click", () => loadWhitelist(Math.max(1, whitelistPage - 1)));
    nextWhitelistBtn.addEventListener("click", () => loadWhitelist(Math.min(whitelistTotalPages, whitelistPage + 1)));
    prevApplicationsBtn.addEventListener("click", () => loadApplications(Math.max(1, applicationsPage - 1)));
    nextApplicationsBtn.addEventListener("click", () => loadApplications(Math.min(applicationsTotalPages, applicationsPage + 1)));
    auditSearchBtn.addEventListener("click", () => loadAuditLogs(1));
    prevAuditBtn.addEventListener("click", () => loadAuditLogs(Math.max(1, auditPage - 1)));
    nextAuditBtn.addEventListener("click", () => loadAuditLogs(Math.min(auditTotalPages, auditPage + 1)));

    loadWhitelist();
    loadApplications();
    loadAuditLogs();
    setCourse(userCourse);
  </script>
</body>
</html>
