<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>暂时无法连接</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      padding: 28px 20px;
      color: #173c27;
      background: repeating-linear-gradient(45deg, #eff9e8 0 14px, #e4f3dc 14px 28px);
      font-family: system-ui, sans-serif;
    }
    main {
      width: min(100%, 420px);
      padding: 28px 22px;
      text-align: center;
      background: #fff9e9;
      border: 4px solid #76502f;
      box-shadow: 0 6px 0 #4c321f;
    }
    .gem {
      width: 64px;
      height: 76px;
      margin: 0 auto 20px;
      background: #35cf7a;
      clip-path: polygon(50% 0, 88% 24%, 78% 76%, 50% 100%, 22% 76%, 12% 24%);
      box-shadow: inset 12px 0 #168d50, inset -10px 0 #8cf0b5;
    }
    h1 { margin: 0 0 12px; font-size: 25px; }
    p { margin: 0 0 22px; line-height: 1.7; color: #4b5a48; }
    button {
      min-width: 160px;
      min-height: 48px;
      color: #fff;
      background: #277f3d;
      border: 3px solid #174d29;
      box-shadow: 0 4px 0 #10381d;
      font: inherit;
      font-weight: 800;
    }
    button:active { transform: translateY(3px); box-shadow: 0 1px 0 #10381d; }
  </style>
</head>
<body>
  <main>
    <div class="gem" aria-hidden="true"></div>
    <h1>暂时无法连接学习服务</h1>
    <p>请检查网络后重试。如果服务器正在维护，稍等一会儿再回来。</p>
    <button type="button" id="retryBtn">重新连接</button>
  </main>
  <script>
    document.querySelector("#retryBtn").addEventListener("click", () => {
      location.replace("https://eduplayer.top/login");
    });
  </script>
</body>
</html>
